  function bindTagEvents(note){
    const row = $('#tagRow');
    if(!row) return;
    row.querySelectorAll('[data-action="removeTag"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.getAttribute('data-tag');
        note.tags = (note.tags||[]).filter(t => t !== tag);
        queueSave(note);
        renderEditor();
        renderTagFilterRow();
      });
    });
    const input = $('#tagAddInput');
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ','){
        e.preventDefault();
        const val = input.value.trim().replace(/,$/,'').toLowerCase();
        if(val && !(note.tags||[]).includes(val)){
          note.tags = [...(note.tags||[]), val];
          queueSave(note);
          renderEditor();
          renderTagFilterRow();
          setTimeout(()=>{ const i = $('#tagAddInput'); if(i) i.focus(); }, 0);
        } else {
          input.value = '';
        }
      }
    });
  }

  function updateMetaRow(note){
    const row = $('#metaRow');
    if(!row) return;
    const parts = [`Edited ${fmtDate(note.updatedAt)}`];
    if(note.type === 'todo'){
      const done = note.todos.filter(t=>t.done).length;
      parts.push(`${done}/${note.todos.length} complete`);
    } else {
      parts.push(`${wordCount(contentAsPlainText(note))} words`);
    }
    row.innerHTML = parts.map(p => `<span>${p}</span>`).join('<span class="sep">·</span>');
  }

  function bindEditorEvents(note){
    const titleInput = $('#titleInput');
    titleInput.addEventListener('input', () => {
      note.title = titleInput.value;
      queueSave(note);
    });

    if(note.type === 'todo'){
      bindTodoEvents(note);
    } else if(note.type === 'code'){
      initializeCodeSimulator(note);
    } else {
      bindRichEvents(note);
    }
  }

  function autoResize(ta){
    ta.style.height = 'auto';
    ta.style.height = Math.max(400, ta.scrollHeight) + 'px';
  }

  // ---------- Rich text (note / journal) ----------
  let savedRichRange = null;

  function htmlToPlainText(html){
    const tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    // textContent on a detached element ignores visual line breaks, so
    // block-level boundaries need to become real newlines first, or
    // multi-paragraph notes collapse into one run-on line on export.
    tmp.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
    tmp.querySelectorAll('div, p, li, h1, h2, h3, h4, h5, h6, blockquote').forEach(el => {
      el.insertAdjacentText('afterend', '\n');
    });
    return (tmp.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  }

  function updateRichPlaceholder(editable){
    const empty = editable.textContent.trim() === '';
    editable.classList.toggle('is-empty', empty);
  }

  function trackRichSelection(){
    const editable = $('#richArea');
    if(!editable) return;
    const sel = window.getSelection();
    if(sel && sel.rangeCount > 0){
      const range = sel.getRangeAt(0);
      if(editable.contains(range.commonAncestorContainer)){
        savedRichRange = range.cloneRange();
      }
    }
  }

  function restoreRichSelection(){
    const editable = $('#richArea');
    if(!editable) return;
    editable.focus();
    const sel = window.getSelection();
    if(savedRichRange){
      sel.removeAllRanges();
      try{ sel.addRange(savedRichRange); }catch(e){}
      return;
    }
    // No prior selection captured (e.g. toolbar clicked before ever
    // clicking into the editor) — place the caret at the end so
    // commands have somewhere to apply.
    if(!sel.rangeCount || !editable.contains(sel.getRangeAt(0).commonAncestorContainer)){
      const range = document.createRange();
      range.selectNodeContents(editable);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  function updateToolbarState(){
    const toolbar = $('#richToolbar');
    if(!toolbar) return;
    const cmds = ['bold','italic','underline','strikeThrough','insertUnorderedList','insertOrderedList','justifyLeft','justifyCenter','justifyRight','justifyFull'];
    cmds.forEach(cmd => {
      const btn = toolbar.querySelector(`.rt-btn[data-cmd="${cmd}"]`);
      if(!btn) return;
      let state = false;
      try{ state = document.queryCommandState(cmd); }catch(e){}
      btn.classList.toggle('active', state);
    });

    const editable = $('#richArea');
    if(!editable) return;

    // Update font family dropdown
    const famSelect = $('#fontFamilySelect');
    if(famSelect){
      let activeFam = '';
      try{ activeFam = document.queryCommandValue('fontName'); }catch(e){}
      activeFam = activeFam ? activeFam.replace(/['"]/g, '') : '';
      
      let found = false;
      for(let i=0; i<famSelect.options.length; i++){
        const optVal = famSelect.options[i].value.replace(/['"]/g, '');
        if(optVal && activeFam.toLowerCase() === optVal.toLowerCase()){
          famSelect.value = famSelect.options[i].value;
          found = true;
          break;
        }
      }
      if(!found) famSelect.value = '';
    }


  }

  function bindRichEvents(note){
    const editable = $('#richArea');
    updateRichPlaceholder(editable);
    updateToolbarState();

    editable.addEventListener('input', () => {
      note.content = editable.innerHTML;
      queueSave(note);
      updateMetaRow(note);
      updateRichPlaceholder(editable);
    });
    editable.addEventListener('keyup', () => { trackRichSelection(); updateToolbarState(); });
    editable.addEventListener('mouseup', () => { trackRichSelection(); updateToolbarState(); });
    editable.addEventListener('focus', updateToolbarState);

    const sync = () => {
      note.content = editable.innerHTML;
      queueSave(note);
      updateMetaRow(note);
      updateRichPlaceholder(editable);
    };

    editorInner.querySelectorAll('.rt-btn[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        restoreRichSelection();
        document.execCommand(btn.getAttribute('data-cmd'), false, null);
        sync();
        updateToolbarState();
      });
    });

    const fam = $('#fontFamilySelect');
    fam.addEventListener('mousedown', trackRichSelection);
    fam.addEventListener('change', () => {
      setTimeout(() => {
        restoreRichSelection();
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        
        const range = sel.getRangeAt(0);
        if (range.collapsed && fam.value) {
          const el = document.createElement('span');
          el.style.fontFamily = fam.value;
          el.innerHTML = '&#8203;';
          range.insertNode(el);
          
          const newRange = document.createRange();
          newRange.setStart(el.firstChild, 1);
          newRange.collapse(true);
          sel.removeAllRanges();
          sel.addRange(newRange);
        } else if (fam.value) {
          document.execCommand('styleWithCSS', false, false);
          document.execCommand('fontName', false, fam.value);
        }
        sync();
      }, 0);
    });


    const textColorInput = $('#textColorInput');
    textColorInput.addEventListener('mousedown', trackRichSelection);
    textColorInput.addEventListener('input', () => {
      restoreRichSelection();
      document.execCommand('foreColor', false, textColorInput.value);
      $('#textColorBar').style.background = textColorInput.value;
      sync();
    });

    const hlInput = $('#highlightColorInput');
    hlInput.addEventListener('mousedown', trackRichSelection);
    hlInput.addEventListener('input', () => {
      restoreRichSelection();
      if(!document.execCommand('hiliteColor', false, hlInput.value)){
        document.execCommand('backColor', false, hlInput.value);
      }
      $('#highlightColorBar').style.background = hlInput.value;
      sync();
    });
  }

  function bindTodoEvents(note){
    const rows = editorInner.querySelectorAll('.todo-row');
    rows.forEach(row => {
      const id = row.getAttribute('data-id');
      const item = note.todos.find(t => t.id === id);
      row.querySelector('[data-action="toggle"]').addEventListener('click', () => {
        item.done = !item.done;
        renderEditor();
        queueSave(note);
      });
      row.querySelector('[data-action="text"]').addEventListener('input', (e) => {
        item.text = e.target.value;
        queueSave(note);
        updateMetaRow(note);
      });
      row.querySelector('[data-action="remove"]').addEventListener('click', () => {
        note.todos = note.todos.filter(t => t.id !== id);
        renderEditor();
        queueSave(note);
      });
    });

    const addInput = $('#todoAddInput');
    addInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && addInput.value.trim()){
        note.todos.push({ id: uid(), text: addInput.value.trim(), done:false });
        queueSave(note);
        renderEditor();
        setTimeout(()=>{
          const inp = $('#todoAddInput');
          if(inp) inp.focus();
        }, 0);
      }
    });

    const prog = $('#todoProgress');
    if(prog){
      const done = note.todos.filter(t=>t.done).length;
      prog.textContent = note.todos.length ? `${done} of ${note.todos.length} complete` : '';
    }
  }

  // ---------- Actions ----------
  async function createNote(){
    const note = {
      id: uid(), type:'note', title:'', content:'', todos:[], tags:[], pinned:false,
      createdAt: Date.now(), updatedAt: Date.now()
    };
    notes.unshift(note);
    activeId = note.id;
    await persistNote(note);
    await persistIndex();
    renderSidebar();
    renderEditor();
    setTimeout(()=>{
      const t = $('#titleInput');
      if(t) t.focus();
    }, 0);
  }

  async function deleteActive(){
    const note = getActive();
    if(!note) return;
    if(!confirm(`Delete “${note.title || 'Untitled'}”? This can’t be undone.`)) return;
    notes = notes.filter(n => n.id !== note.id);
    await deleteNoteStorage(note.id);
    await persistIndex();
    activeId = notes.length ? notes[0].id : null;
    renderSidebar();
    renderEditor();
    showToast('Note deleted');
  }

  async function duplicateActive(){
    const note = getActive();
    if(!note) return;
    const copy = JSON.parse(JSON.stringify(note));
    copy.id = uid();
    copy.title = (note.title || 'Untitled') + ' copy';
    copy.todos = copy.todos.map(t => ({...t, id: uid()}));
    copy.tags = [...(note.tags||[])];
    copy.pinned = false;
    copy.createdAt = Date.now();
    copy.updatedAt = Date.now();
    notes.unshift(copy);
    activeId = copy.id;
    await persistNote(copy);
    await persistIndex();
    renderSidebar();
    renderEditor();
    showToast('Note duplicated');
  }

  // ---------- Bulk actions ----------
  function toggleSelectMode(){
    selectMode = !selectMode;
    selectedIds.clear();
    $('#selectModeBtn').classList.toggle('on', selectMode);
    renderSidebar();
  }

  function selectAllVisible(){
    const visibleIds = filteredNotes().map(n => n.id);
    const allSelected = visibleIds.length > 0 && visibleIds.every(id => selectedIds.has(id));
    if(allSelected){
      visibleIds.forEach(id => selectedIds.delete(id));
    } else {
      visibleIds.forEach(id => selectedIds.add(id));
    }
    renderSidebar();
  }

  async function bulkDelete(){
    if(selectedIds.size === 0) return;
    if(!confirm(`Delete ${selectedIds.size} note${selectedIds.size===1?'':'s'}? This can't be undone.`)) return;
    const ids = Array.from(selectedIds);
    for(const id of ids) await deleteNoteStorage(id);
    notes = notes.filter(n => !selectedIds.has(n.id));
    await persistIndex();
    if(activeId && selectedIds.has(activeId)){
      activeId = notes.length ? notes[0].id : null;
    }
    selectedIds.clear();
    selectMode = false;
    renderSidebar();
    renderEditor();
    showToast('Notes deleted');
  }

  function bulkTag(){
    if(selectedIds.size === 0) return;
    const val = prompt('Add tag to selected notes:');
    if(!val) return;
    const tag = val.trim().toLowerCase();
    if(!tag) return;
    notes.forEach(n => {
      if(selectedIds.has(n.id)){
        n.tags = n.tags || [];
        if(!n.tags.includes(tag)) n.tags.push(tag);
        queueSave(n);
      }
    });
    renderSidebar();
    showToast(`Tagged ${selectedIds.size} note${selectedIds.size===1?'':'s'} #${tag}`);
  }

  function bulkExport(){
    if(selectedIds.size === 0) return;
    const selected = notes.filter(n => selectedIds.has(n.id));
    const text = selected.map(n => {
      let body = `${n.title || 'Untitled'}\n\n`;
      body += n.type === 'todo'
        ? n.todos.map(t => `${t.done ? '[x]' : '[ ]'} ${t.text}`).join('\n')
        : contentAsPlainText(n);
      return body;
    }).join('\n\n-----\n\n');
    const blob = new Blob([text], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `notes-export-${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Downloaded');
  }

  function exportActive(){
    const note = getActive();
    if(!note){ showToast('No note to export'); return; }
    let text = `${note.title || 'Untitled'}\n\n`;
    if(note.type === 'todo'){
      text += note.todos.map(t => `${t.done ? '[x]' : '[ ]'} ${t.text}`).join('\n');
    } else {
      text += contentAsPlainText(note);
    }
    const blob = new Blob([text], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const ext = note.type === 'code' ? 'txt' : 'md';
    a.download = `${(note.title||'untitled').replace(/[^\w\- ]/g,'').trim() || 'untitled'}.${ext}`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Downloaded');
  }

  function exportWord(){
    const note = getActive();
    if(!note){ showToast('No note to export'); return; }

    let bodyHtml;
    if(note.type === 'todo'){
      bodyHtml = note.todos.map(t => `<p>${t.done ? '☑' : '☐'}&nbsp;&nbsp;${escapeHtml(t.text)}</p>`).join('') || '<p></p>';
    } else if(note.type === 'code'){
      bodyHtml = `<pre style="font-family:'Courier New',monospace;font-size:11pt;white-space:pre-wrap;">${escapeHtml(note.content)}</pre>`;
    } else {
      // note/journal content is already the rich editor's own HTML output
      bodyHtml = note.content || '<p></p>';
    }

    const metaBits = [TYPE_LABEL[note.type], fmtDate(note.updatedAt)];
    if(note.tags && note.tags.length) metaBits.push(note.tags.map(t=>'#'+t).join(' '));

    const html = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>${escapeHtml(note.title || 'Untitled')}</title>

<style>
  body{ font-family:Calibri, Arial, sans-serif; font-size:11pt; color:#111; }
  h1{ font-size:20pt; font-weight:600; margin:0 0 4pt; }
  .doc-meta{ color:#666; font-size:9pt; margin-bottom:20pt; }
</style>
</head>
<body>
  <h1>${escapeHtml(note.title || 'Untitled')}</h1>
  <div class="doc-meta">${metaBits.map(escapeHtml).join(' &middot; ')}</div>
  ${bodyHtml}
</body>
</html>`;

    const blob = new Blob(['\ufeff', html], {type:'application/msword'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(note.title||'untitled').replace(/[^\w\- ]/g,'').trim() || 'untitled'}.doc`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Downloaded');
  }

  function togglePin(){
    const note = getActive();
    if(!note) return;
    note.pinned = !note.pinned;
    queueSave(note);
    updatePinIcon(note);
    renderSidebar();
    showToast(note.pinned ? 'Pinned' : 'Unpinned');
  }

  function exportPdf(){
    const note = getActive();
    if(!note){ showToast('No note to export'); return; }
    const area = $('#pdfExportArea');
    const metaBits = [TYPE_LABEL[note.type], fmtDate(note.updatedAt)];
    if(note.tags && note.tags.length) metaBits.push(note.tags.map(t=>'#'+t).join(' '));

    let bodyHtml;
    if(note.type === 'todo'){
      bodyHtml = note.todos.map(t => `
        <div class="print-todo">
          <span>${t.done ? '☑' : '☐'}</span><span>${escapeHtml(t.text)}</span>
        </div>`).join('');
    } else if(note.type === 'code'){
      bodyHtml = `<div class="print-body print-code">${escapeHtml(note.content)}</div>`;
    } else {
      // note/journal content is the rich editor's own HTML output
      // (already safe, browser-generated markup) — insert it directly
      // so formatting like bold/italic/highlights survives in print.
      bodyHtml = `<div class="print-body">${note.content || ''}</div>`;
    }

    area.innerHTML = `
      <h1>${escapeHtml(note.title || 'Untitled')}</h1>
      <div class="print-meta">${metaBits.map(escapeHtml).join(' · ')}</div>
      ${bodyHtml}
    `;
    document.title = (note.title || 'Untitled') + ' — Notepad';
    window.print();
    setTimeout(()=>{ document.title = 'Notepad — write, think, keep'; }, 500);
  }

  function updateRulesIcon(){
    const btn = $('#rulesToggle');
    if(!btn) return;
    btn.classList.toggle('on', rulesOn);
    btn.title = rulesOn ? 'Turn off ruled lines' : 'Turn on ruled lines';
  }

  async function toggleRules(){
    rulesOn = !rulesOn;
    updateRulesIcon();
    await persistSettings();
    renderEditor();
    showToast(rulesOn ? 'Ruled lines on' : 'Ruled lines off');
  }

  function changeActiveType(newType){
    const note = getActive();
    if(!note) return;
    convertNoteContent(note, note.type, newType);
    note.type = newType;
    queueSave(note);
    renderSidebar();
    renderEditor();
  }

  // note/journal store contenteditable HTML; code stores plain text.
  // Switching types needs to translate between the two, or the raw
  // markup (or unescaped text) shows up wrong in the new editor.
  function convertNoteContent(note, oldType, newType){
    const richTypes = ['note', 'journal'];
    const oldIsRich = richTypes.includes(oldType);
    const newIsRich = richTypes.includes(newType);
    if(oldIsRich === newIsRich) return;
    if(oldIsRich && !newIsRich){
      note.content = htmlToPlainText(note.content || '');
    } else if(!oldIsRich && newIsRich){
      note.content = escapeHtml(note.content || '').replace(/\n/g, '<br>');
    }
  }

  async function applyTheme(next, persist){
    theme = next;
    if(theme === 'dark'){
      document.documentElement.setAttribute('data-theme','dark');
      $('#themeIcon').innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    } else {
      document.documentElement.removeAttribute('data-theme');
      $('#themeIcon').innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
    }
    // The soft accent tint is blended against this theme's surface
    // color, so a custom accent needs recomputing whenever the
    // theme switches, or light/dark would show a stale blend.
    if(accentColor) applyAccent(accentColor, false);
    applyMonacoThemeForActiveNote();
    if(persist) await persistSettings();
  }

  // ---------- Custom accent color ----------
  function hexToRgb(hex){
    hex = (hex || '').replace('#', '');
    if(hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const num = parseInt(hex, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }
  function rgbToHex({r, g, b}){
    return '#' + [r, g, b].map(v =>
      Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')
    ).join('');
  }
  function mixColors(hexA, hexB, weightA){
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    return rgbToHex({
      r: a.r * weightA + b.r * (1 - weightA),
      g: a.g * weightA + b.g * (1 - weightA),
      b: a.b * weightA + b.b * (1 - weightA)
    });
  }
  function computeAccentSoft(hex){
    // Blend the accent color toward the theme's own surface tone,
    // matching how the built-in accents were tuned (a light wash in
    // light mode, a muted deep tint in dark mode).
    return theme === 'dark' ? mixColors(hex, '#242320', 0.28) : mixColors(hex, '#FFFFFF', 0.13);
  }

  let borderColor = null;

  function applyBorderColor(hex, persist){
    borderColor = hex;
    document.documentElement.style.setProperty('--border', hex);
    const input = $('#borderColorInput');
    if(input) input.value = hex;
    const swatch = $('#borderSwatch');
    if(swatch) swatch.style.background = hex;
    if(persist) persistSettings();
  }

  function resetBorderColor(persist){
    borderColor = null;
    document.documentElement.style.removeProperty('--border');
    const defaultBorder = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
    const input = $('#borderColorInput');
    if(input) input.value = defaultBorder;
    const swatch = $('#borderSwatch');
    if(swatch) swatch.style.background = ''; // falls back to CSS var(--border)
    if(persist) persistSettings();
    showToast('Border color reset to default');
  }

  function applyAccent(hex, persist){
    accentColor = hex;
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent-soft', computeAccentSoft(hex));
    const input = $('#accentColorInput');
    if(input) input.value = hex;
    const swatch = $('#accentSwatch');
    if(swatch) swatch.style.background = hex;
    if(persist) persistSettings();
  }

  function resetAccent(persist){
    accentColor = null;
    document.documentElement.style.removeProperty('--accent');
    document.documentElement.style.removeProperty('--accent-soft');
    const defaultAccent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const input = $('#accentColorInput');
    if(input) input.value = defaultAccent;
    const swatch = $('#accentSwatch');
    if(swatch) swatch.style.background = ''; // falls back to CSS var(--accent), so it still follows theme
    if(persist) persistSettings();
    showToast('Accent reset to default');
  }

  // ---------- Wiring ----------
  const brandMark = $('#brandMark');
  if (brandMark) {
    brandMark.addEventListener('click', () => {
      searchInput.value = '';
      activeTagFilter = null;
      setFilter('all');
      activeId = null;
      renderSidebar();
      renderEditor();
    });
  }

  $('#newNoteBtn').addEventListener('click', createNote);
  $('#deleteBtn').addEventListener('click', deleteActive);
  $('#duplicateBtn').addEventListener('click', duplicateActive);
  $('#pinToggle').addEventListener('click', togglePin);
  $('#rulesToggle').addEventListener('click', toggleRules);

  $('#backupBtn').addEventListener('click', downloadBackup);
  $('#restoreBtn').addEventListener('click', () => $('#restoreFileInput').click());
  $('#restoreFileInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(file) restoreFromFile(file);
    e.target.value = '';
  });

  document.getElementById('storageBannerBackup').addEventListener('click', downloadBackup);
  document.getElementById('storageBannerRetry').addEventListener('click', async () => {
    showToast('Checking storage…');
    const ok = await checkStorageHealth();
    showToast(ok ? 'Storage is working again' : 'Still not working — try backing up');
  });
  document.getElementById('storageBannerDismiss').addEventListener('click', () => {
    document.getElementById('storageBanner').classList.remove('show');
  });
  // Re-check periodically in case storage breaks mid-session (e.g. quota
  // hit after many notes, or a browser privacy setting kicking in).
  setInterval(checkStorageHealth, 60000);

  $('#selectModeBtn').addEventListener('click', toggleSelectMode);
  $('#bulkCancelBtn').addEventListener('click', toggleSelectMode);
  $('#selectAllBtn').addEventListener('click', selectAllVisible);
  $('#bulkTagBtn').addEventListener('click', bulkTag);
  $('#bulkExportBtn').addEventListener('click', bulkExport);
  $('#bulkDeleteBtn').addEventListener('click', bulkDelete);

  function bindExportMenu(btnId, menuId){
    const btn = $('#' + btnId);
    const menu = $('#' + menuId);
    if(!btn || !menu) return;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.export-menu.open').forEach(m => { if(m !== menu) m.classList.remove('open'); });
      menu.classList.toggle('open');
    });
    menu.querySelectorAll('button[data-format]').forEach(optBtn => {
      optBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.remove('open');
        const fmt = optBtn.getAttribute('data-format');
        if(fmt === 'txt') exportActive();
        else if(fmt === 'pdf') exportPdf();
        else if(fmt === 'docx') exportWord();
      });
    });
  }
  bindExportMenu('exportBtn', 'exportMenuTop');
  bindExportMenu('exportAllBtn', 'exportMenuSidebar');
  document.addEventListener('click', () => {
    document.querySelectorAll('.export-menu.open').forEach(m => m.classList.remove('open'));
  });
  $('#typeSelect').addEventListener('change', (e) => changeActiveType(e.target.value));

  $('#codeViewToggle').querySelectorAll('button[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      const note = getActive();
      if(!note) return;
      setCodeView(note.id, btn.getAttribute('data-view'));
      setFilter('code');
      renderEditor();
    });
  });

  window.addEventListener('message', (e) => {
    if(e.data && e.data.__notepadConsole) {
      const log = document.getElementById('codeConsoleLog');
      const wrap = document.getElementById('codeConsoleWrap');
      if(!log || !wrap) return;
      const line = document.createElement('div');
      line.className = 'code-console-line' + (e.data.type === 'error' ? ' is-error' : e.data.type === 'warn' ? ' is-warn' : '');
      line.textContent = e.data.message;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
      wrap.classList.add('show');
    }

    if (e.data && e.data.type === 'js-console') {
      appendConsoleLog(e.data.message, e.data.logType);
      if (e.data.logType === 'error') {
        updateConsoleStatus('Failed with errors', true);
      }
      if (window.lastJsExecutionStart) {
        const duration = (performance.now() - window.lastJsExecutionStart).toFixed(0);
        updateConsoleTime(duration);
      }
    }
  });
  $('#searchInput').addEventListener('input', renderSidebar);

  $('#themeToggle').addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark', true));

  $('#accentColorInput').addEventListener('input', (e) => applyAccent(e.target.value, true));
  $('#accentBtn').addEventListener('dblclick', (e) => { e.preventDefault(); resetAccent(true); });

  $('#borderColorInput').addEventListener('input', (e) => applyBorderColor(e.target.value, true));
  $('#borderBtn').addEventListener('dblclick', (e) => { e.preventDefault(); resetBorderColor(true); });

  $('#focusToggle').addEventListener('click', () => {
    app.classList.toggle('focus-mode');
    setTimeout(() => { if (monacoEditorInstance) monacoEditorInstance.layout(); }, 350);
  });
  $('#sidebarToggle').addEventListener('click', () => {
    if(window.innerWidth <= 760){ app.classList.toggle('sidebar-open'); }
    else{ app.classList.toggle('focus-mode'); }
    setTimeout(() => { if (monacoEditorInstance) monacoEditorInstance.layout(); }, 350);
  });

  window.addEventListener('resize', () => {
    if (monacoEditorInstance) monacoEditorInstance.layout();
  });

  function setFilter(next){
    filter = next;
    document.querySelectorAll('.filter-tab').forEach(t => {
      t.classList.toggle('active', t.getAttribute('data-filter') === next);
    });
    renderSidebar();
  }

  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => setFilter(tab.getAttribute('data-filter')));
  });

  document.addEventListener('keydown', (e) => {
    const meta = e.metaKey || e.ctrlKey;
    if(meta && e.key.toLowerCase() === 'n'){ e.preventDefault(); createNote(); }
    if(meta && e.key.toLowerCase() === 'f'){ e.preventDefault(); searchInput.focus(); }
    if(meta && e.key.toLowerCase() === 'b' && document.activeElement && document.activeElement.id === 'richArea'){
      e.preventDefault();
      document.execCommand('bold', false, null);
      const note = getActive();
      const editable = $('#richArea');
      if(note && editable){
        note.content = editable.innerHTML;
        queueSave(note);
        updateMetaRow(note);
        updateToolbarState();
      }
    }
  });

  loadAll();
})();
</script>
